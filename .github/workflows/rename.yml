name: Rename index file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename index-v13.html to index.html
        run: |
          git config user.name "abeditstapeball-max"
          git config user.email "abeditstapeball-max@users.noreply.github.com"
          git mv index-v13.html index.html
          git commit -m "Rename index-v13.html to index.html"
          git push
