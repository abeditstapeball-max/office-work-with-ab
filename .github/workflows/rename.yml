name: Rename v14 to index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename index-v14.html to index.html
        run: |
          if [ -f index-v14.html ]; then
            git config user.name "abeditstapeball-max"
            git config user.email "abeditstapeball-max@users.noreply.github.com"
            git mv index-v14.html index.html
            git commit -m "Update to v2.3 - English professional UI"
            git push
          else
            echo "index-v14.html not found, nothing to do"
          fi
